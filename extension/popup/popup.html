<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHADOW — Dark Pattern Detector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 330px;
      min-height: 220px;
      background: #0f111a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #131728 0%, #1a1e36 100%);
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .shield-icon {
      width: 24px;
      height: 24px;
      color: #7c3aed;
    }

    .logo {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
    }

    .subtitle {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .version-tag {
      font-size: 10px;
      font-weight: 700;
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .site-card {
      background: #161a29;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .site-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .site-host {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      word-break: break-all;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      flex-shrink: 0;
    }

    .status-dot.inactive {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    }

    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .status-text {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #1e2438;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .info-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.2);
      padding: 8px 10px;
      border-radius: 6px;
    }

    .info-icon {
      color: #a78bfa;
      flex-shrink: 0;
    }
    /* Match the assistant's light theme. */
    body { background: #f8fafc; color: #172033; color-scheme: light; }
    .header { background: #fff; border-bottom-color: #dfe5ef; }
    .logo, .site-host { color: #172033; }
    .subtitle, .info-footer, .status-text { color: #52627a; }
    .site-card { background: #fff; border-color: #dfe5ef; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <div>
        <div class="logo">SHADOW</div>
        <div class="subtitle">Detect. Defend. Act.</div>
      </div>
    </div>
    <span class="version-tag">MV3 · v1.2</span>
  </div>

  <div class="body">
    <div class="site-card">
      <div class="site-label">Target Page</div>
      <div class="site-host" id="siteHost">Reading active tab…</div>
      <div class="status-row">
        <div class="status-dot inactive" id="statusDot"></div>
        <span class="status-text" id="statusText">Checking status…</span>
      </div>
    </div>

    <button class="btn btn-primary" id="actionBtn" disabled>
      <span id="actionBtnText">Checking…</span>
    </button>

    <div class="info-footer" id="infoBox">
      <span class="info-icon">🔒</span>
      <span id="infoText">User-initiated activation via activeTab. Sensitive credentials and passwords are strictly protected and never collected.</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
